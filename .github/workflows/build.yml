name: build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore OctoHD.slnx
      - run: dotnet build OctoHD.slnx --configuration Release --no-restore -p:PublishAot=false
      - run: dotnet test OctoHD.slnx --configuration Release --no-build -p:PublishAot=false
      - run: dotnet format OctoHD.slnx --verify-no-changes --no-restore

  publish:
    name: Build ${{ matrix.runtime }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            runtime: win-x64
          - runner: windows-2025
            runtime: win-arm64
          - runner: ubuntu-24.04
            runtime: linux-x64
          - runner: ubuntu-24.04-arm
            runtime: linux-arm64
          - runner: macos-15-intel
            runtime: osx-x64
          - runner: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish self-contained smoke build
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v7
        with:
          name: OctoHD-smoke-${{ matrix.runtime }}
          path: releases/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 7
