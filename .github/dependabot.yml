version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      test-tooling:
        patterns:
          - "coverlet*"
          - "xunit*"
    # Avalonia.Headless.XUnit 12.1.1 fails test discovery with xunit.v3.mtp-v2 4.x.
    ignore:
      - dependency-name: xunit.v3.mtp-v2
        versions:
          - ">= 4.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
